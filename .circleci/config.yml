version: 2.1
executors:
  yocto-executor:
    docker:
      - image: crops/yocto:fedora-40-base
jobs:
  build-yocto:
    executor: yocto-executor
    steps:
      - checkout
      - run:
          name: Install kas
          command: |
            pip3 install kas
      - run:
          name: Build Yocto Project
          command: kas build kas/intel-corei7-64.yaml
workflows:
  version: 2
  build:
    jobs:
      - build-yocto