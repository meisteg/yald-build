version: 2.1
executors:
  linux-executor:
    machine:
      image: ubuntu-2404:2024.11.1
jobs:
  build-yocto:
    executor: linux-executor
    steps:
      - checkout
      - run:
          name: Install kas
          command: |
            echo 'export PATH=~/.local/bin:"$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            pip3 install kas
            kas --version
      - run:
          name: Node specs
          command: df -h
      - run:
          name: Build Target Image
          command: kas build kas/intel-corei7-64.yaml
      - run:
          name: Build SDK
          command: kas build kas/intel-corei7-64.yaml:kas/sdk.yaml
workflows:
  version: 2
  build:
    jobs:
      - build-yocto:
          matrix:
            parameters:
              target: [intel-corei7-64, qemux86-64]
