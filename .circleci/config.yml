version: 2.1
executors:
  linux-executor:
    machine:
      image: ubuntu-2404:2024.11.1
jobs:
  build-yocto:
    parameters:
      target:
        type: string
    executor: linux-executor
    steps:
      - checkout
      - run:
          name: Install kas
          command: |
            echo 'export PATH=~/.local/bin:"$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            pip3 install kas
            kas --version
      - run:
          name: Disable unprivileged user namespace restrictions
          # Resolves "User namespaces are not usable by BitBake" error
          # See also: https://discourse.ubuntu.com/t/ubuntu-24-04-lts-noble-numbat-release-notes/39890#p-99950-unprivileged-user-namespace-restrictions
          command: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - run:
          name: Build Target Image
          command: kas-container build kas/<< parameters.target >>.yaml
      # Disable SDK builds since not actively used to reduce build time
      # - run:
      #     name: Build SDK
      #     command: kas-container build kas/<< parameters.target >>.yaml:kas/sdk.yaml
workflows:
  version: 2
  build:
    jobs:
      - build-yocto:
          matrix:
            parameters:
              target: [intel-corei7-64, qemux86-64, raspberrypi3-64]
