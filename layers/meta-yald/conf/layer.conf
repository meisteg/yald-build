# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Only activate content when identified layers are present
BBFILES_DYNAMIC += " \
    intel:${LAYERDIR}/dynamic-layers/meta-intel/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-yald"
BBFILE_PATTERN_meta-yald = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-yald = "6"

LAYERSERIES_COMPAT_meta-yald = "walnascar"
