header:
  version: 14
  includes:
  - kas/distro.yaml

machine: intel-corei7-64

repos:
  meta-intel:
    url: "https://git.yoctoproject.org/git/meta-intel"
    commit: a75e59bdba66fa6dcab8f2208e73fbf2fc576457
    path: layers/meta-intel

local_conf_header:
  fstypes: |
    # Needed for qemu
    IMAGE_FSTYPES += "ext4"

    # Enable faster flashing with bmaptool
    IMAGE_FSTYPES += "wic.bmap"

    # bmaptool supports flashing a compressed wic file.
    # Create one to use less space when saving build artifacts.
    IMAGE_FSTYPES += "wic.xz"
