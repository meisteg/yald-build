header:
  version: 19

distro: yald

target:
  - yald-image-prod
  - yald-image-dev

repos:
  meta-yocto:
    url: https://git.yoctoproject.org/git/meta-yocto
    tag: yocto-6.0
    commit: 904846ae078ee20de073040ebb77c86e19250f56
    path: layers/meta-yocto
    layers:
      meta-poky:
      meta-yocto-bsp:

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    tag: yocto-6.0
    commit: 42fa856a00ac16b2a7a83d7ecfa60a5be192b16c
    path: layers/openembedded-core
    layers:
      meta:

  bitbake:
    url: https://git.openembedded.org/bitbake
    tag: yocto-6.0
    commit: 33581c84f3a85008239acbd940501a35de48dc91
    path: layers/bitbake
    layers:
      .: disabled

  meta-yald:
    path: layers/meta-yald

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    branch: wrynose
    commit: 9af4488d46cb4fd4c0d2d64820c86225ebd6ac71
    path: layers/meta-openembedded
    layers:
      meta-oe:
      meta-python:
      meta-networking:

local_conf_header:
  reduce_diskspace: |
    INHERIT += "rm_work"
