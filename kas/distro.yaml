header:
  version: 19

distro: yald

target:
  - yald-image-prod
  - yald-image-dev

repos:
  meta-yocto:
    url: https://git.yoctoproject.org/git/meta-yocto
    tag: yocto-6.0_M3
    commit: 49cbb01d52521bfe557395c9ebfae6b1c162581e
    path: layers/meta-yocto
    layers:
      meta-poky:
      meta-yocto-bsp:

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    tag: yocto-6.0_M3
    commit: f235ffc43c7783a84e1ac0dce8489fcba8354e12
    path: layers/openembedded-core
    layers:
      meta:

  bitbake:
    url: https://git.openembedded.org/bitbake
    tag: yocto-6.0_M3
    commit: 5d722b5d65e4eef7befe6376983385421e993f86
    path: layers/bitbake
    layers:
      .: disabled

  meta-yald:
    path: layers/meta-yald

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    branch: wrynose
    commit: 420222862f5a6d95023b8f5f3b7e1808b2264ef9
    path: layers/meta-openembedded
    layers:
      meta-oe:
      meta-python:
      meta-networking:

local_conf_header:
  reduce_diskspace: |
    INHERIT += "rm_work"
