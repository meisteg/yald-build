header:
  version: 14

distro: yald

target:
  - yald-image-prod
  - yald-image-dev

repos:
  poky:
    url: "https://git.yoctoproject.org/git/poky"
    commit: db04028d9070f05c3b5dee728473fb234bd24f05   # walnascar-5.2.3
    path: layers/poky
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-yald:
    path: layers/meta-yald

  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded"
    commit: dca497d728792e3cb655c78455c2d649af312ce8
    path: layers/meta-openembedded
    layers:
      meta-oe:
      meta-perl:

local_conf_header:
  reduce_diskspace: |
    INHERIT += "rm_work"
