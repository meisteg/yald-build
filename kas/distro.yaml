header:
  version: 15

distro: yald

target:
  - yald-image-prod
  - yald-image-dev

repos:
  meta-yocto:
    url: "https://git.yoctoproject.org/git/meta-yocto"
    branch: whinlatter
    path: layers/meta-yocto
    layers:
      meta-poky:
      meta-yocto-bsp:

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    branch: whinlatter
    path: layers/openembedded-core
    layers:
      meta:

  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: "2.14"
    path: layers/bitbake
    layers:
      .: disabled

  meta-yald:
    path: layers/meta-yald

  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded"
    branch: whinlatter
    path: layers/meta-openembedded
    layers:
      meta-oe:

local_conf_header:
  reduce_diskspace: |
    INHERIT += "rm_work"
