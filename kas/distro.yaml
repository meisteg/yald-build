header:
  version: 19

distro: yald

target:
  - yald-image-prod
  - yald-image-dev

repos:
  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    tag: yocto-6.0.1
    commit: 8251bdad5fda780a000fb41e6eda82eadf0fa39e
    path: layers/meta-yocto
    layers:
      meta-poky:
      meta-yocto-bsp:

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    tag: yocto-6.0.1
    commit: 06dd66e6220e5ce4ed4b9af4d8231ae5f0a8ce80
    path: layers/openembedded-core
    layers:
      meta:

  bitbake:
    url: https://git.openembedded.org/bitbake
    tag: yocto-6.0.1
    commit: 22021758e66737bcf68dfd2b74adc6a0cb1d42d9
    path: layers/bitbake
    layers:
      .: disabled

  meta-yald:
    path: layers/meta-yald

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    branch: wrynose
    commit: a43f0d532c399458cae44ce66f3799a220fbb497
    path: layers/meta-openembedded
    layers:
      meta-oe:
      meta-python:
      meta-networking:

local_conf_header:
  reduce_diskspace: |
    INHERIT += "rm_work"
