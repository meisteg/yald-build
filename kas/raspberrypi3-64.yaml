header:
  version: 19
  includes:
  - kas/distro.yaml

machine: raspberrypi3-64

repos:
  meta-raspberrypi:
    url: "https://git.yoctoproject.org/git/meta-raspberrypi"
    # Using master branch commit as no whinlatter branch yet
    commit: 44cb3ba79c736732b8d4a9311181055e18e863d3
    path: layers/meta-raspberrypi

local_conf_header:
  serial_output: |
    # Uncomment to enable serial
    # ENABLE_UART = "1"

  usb_boot: |
    CMDLINE_ROOT_PARTITION = "/dev/sda2"
    BOOT_MEDIA = "usb"
    WKS_FILE = "yald-sdimage-raspberrypi.wks"

  fstypes: |
    # Enable faster flashing with bmaptool
    IMAGE_FSTYPES = "wic.xz wic.bmap"
