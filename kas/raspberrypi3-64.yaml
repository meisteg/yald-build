header:
  version: 15
  includes:
  - kas/distro.yaml

machine: raspberrypi3-64

repos:
  meta-raspberrypi:
    url: "https://git.yoctoproject.org/git/meta-raspberrypi"
    branch: whinlatter
    path: layers/meta-raspberrypi

local_conf_header:
  serial_output: |
    # Uncomment to enable serial
    # ENABLE_UART = "1"

  fstypes: |
    # Enable faster flashing with bmaptool
    IMAGE_FSTYPES = "wic.xz wic.bmap"
